[project]
name = "twicetold"
version = "0.1.0"
description = "Claim-level measurement of peer-review homogenization under LLM use"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "fire>=0.7.1",
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "openai>=3.40.0",
    "openreview-py>=2.9.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "requests>=2.34.2",
    "scikit-learn>=1.7",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
detect = ["bitsandbytes>=0.43", "emoji>=2.10", "peft>=0.18", "torch>=2.9", "transformers>=4.57"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.black]
line-length = 130
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
src = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "E402", "I", "PLC0415"]
