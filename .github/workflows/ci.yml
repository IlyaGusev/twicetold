name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --all-extras
      - run: uv run ruff check src scripts tests
      - run: uv run black --check src scripts tests
      - run: uv run python -I scripts/check_no_comments.py
      - run: uv run python -I -m pytest
      - run: |
          for module in extract ai outcomes validate figures between corpus panels fetch gold meld areas external; do
            uv run python -I "src/$module.py" --help > /dev/null
          done
